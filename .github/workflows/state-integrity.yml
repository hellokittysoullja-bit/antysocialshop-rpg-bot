name: State Integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  state-integrity:
    name: Transactional state quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: antysocialshop_state_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d antysocialshop_state_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TOKEN: 123456:ci-state-integrity-token
      RENDER_URL: http://localhost
      DATABASE_URL_AIVEN: postgresql://postgres:postgres@127.0.0.1:5432/antysocialshop_state_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify transactional state invariants
        run: python tests/state_integrity_test.py
